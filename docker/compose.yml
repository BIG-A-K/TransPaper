services:
  agent_container:
    hostname: ${USER}/${CONTAINER_NAME}
    image: transpaper/${CONTAINER_NAME}:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${USER}-${CONTAINER_NAME}
    env_file: ../.env
    network_mode: host
    environment:
      - CONTAINER_NAME=${CONTAINER_NAME}
      - USER=${USER}
      - GROUP=${GROUP}
      - UID=${USER_ID}
      - GID=${GROUP_ID}
    init: true
    command: ["sleep", "infinity"]
    working_dir: /home/${USER}/TransPaper
    volumes:
      - ../:/home/${USER}/TransPaper:rw
      - ./zshrc:/home/${USER}/.zshrc:ro
      # Persist Codex CLI auth/config across container restarts
  ollama:
    image: ollama/ollama
    user: "${USER_ID}:${GROUP_ID}"
    ports:
      - "11434:11434"
    environment:
      - HOME=/home/${USER}
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ${HOME}/.ollama-transpaper:/home/${USER}/.ollama
    restart: unless-stopped
    # For NVIDIA GPU: make up-gpu (GPU=<id> で使用GPUを指定、デフォルト 0)
